name: Cairn Next prerelease
on:
  push:
    tags:
      - 'cairn-next-v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cairn-next
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: cairn-next/pnpm-lock.yaml
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "cairn-next-v$(node -p "require('./package.json').version")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm verify
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac-arm64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cairn-next
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: cairn-next/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate platform-specific license notices
        run: node scripts/generate-notices.cjs
      - name: Desktop integration tests
        if: runner.os == 'Windows'
        run: pnpm test:desktop
      - name: Build unsigned macOS ARM64 DMG
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --mac dmg --arm64 --publish never -c.mac.identity=null -c.mac.notarize=false -c.mac.hardenedRuntime=false
      - name: Build unsigned Windows installer
        if: runner.os == 'Windows'
        run: pnpm exec electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: cairn-next-${{ matrix.platform }}
          path: |
            cairn-next/release/*.dmg
            cairn-next/release/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/cairn-next-v')
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cairn-next-*
          merge-multiple: true
          path: artifacts
      - name: Generate checksums
        run: cd artifacts && sha256sum *.dmg *.exe > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Cairn Next ${{ github.ref_name }}
          body_path: cairn-next/RELEASE_NOTES.md
          prerelease: true
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
