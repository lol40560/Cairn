name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # better-sqlite3 13.x 明確要求 Node 22+；本機驗證使用 Node 24。
          node-version: '24'
          cache: npm
      # Tag 與 package.json 不一致時中止，避免發布檔名與產品版本漂移。
      - name: Verify release version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p \"require('./package.json').version\")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION" || {
            echo "Tag v$TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          }
      # better-sqlite3 的安裝與驗證都需要本機編譯工具。
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      # 跳過 postinstall 的 electron-rebuild，避免測試載入 Electron ABI 的原生模組。
      - name: Install dependencies (skip native scripts)
        run: npm ci --ignore-scripts
      # force_build=1 會略過套件偵測到 prebuild 時的空目標，確實產生本機原生 binary。
      - name: Rebuild better-sqlite3 from source
        working-directory: node_modules/better-sqlite3
        run: npx node-gyp rebuild --release --force_build=1
        env:
          npm_config_build_from_source: "true"
      - name: Verify better-sqlite3 binary
        working-directory: node_modules/better-sqlite3
        run: node -e "require('./build/Release/better_sqlite3.node'); console.log('better-sqlite3 native binary OK')"
      - run: npm test -- --run
      - run: npm run lint
      - run: npx tsc -b --pretty false
      - run: npm run build
      - run: npm run verify:sync

  build-mac:
    needs: verify
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            artifact_path: |
              release/*-arm64.dmg
              release/*-arm64-mac.zip
          - arch: x64
            artifact_path: |
              release/*.dmg
              release/*-mac.zip
              !release/*-arm64.dmg
              !release/*-arm64-mac.zip
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}-artifacts
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  build-win:
    needs: verify
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: |
            release/*.exe
            release/*.zip

  release:
    needs: [build-mac, build-win]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*-artifacts
          merge-multiple: true
          path: artifacts/mac
      - uses: actions/download-artifact@v4
        with:
          name: win-artifacts
          path: artifacts/win
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mac/*
            artifacts/win/*
          draft: false
          prerelease: false
